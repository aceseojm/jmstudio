name: Publish scheduled Deep AI posts

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-drafts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due drafts
        run: python3 .github/scripts/publish-drafts.py
      - name: Commit and push
        run: |
          git add -A deep-ai _drafts sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deep AI 예약 발행 $(TZ=Asia/Seoul date +%F)"
          git push
